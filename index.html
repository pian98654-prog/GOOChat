<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOchat</title>
<style>
:root{--bg:#0b1210;--card:#111c18;--line:#1d2e28;--text:#e9f1ee;--mute:#8fa39b;--go:#2ee08a;--me:#14583a;--bad:#ff7a7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.view{display:none;flex:1;min-height:0;flex-direction:column}.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px}
.logo{font-weight:800;font-size:28px;margin:14px 16px 0}.logo b{color:var(--go)}.logo span{color:var(--text)}
h1{font-size:38px;margin:8px 16px 2px}.sub{color:var(--mute);margin:0 16px 14px}
.search{margin:0 16px 10px;padding:14px 16px;width:calc(100% - 32px);background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text);font-size:17px}
.row{display:flex;gap:14px;padding:12px 0;align-items:center;width:100%}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.mid{flex:1;min-width:0}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
.name{font-weight:700;font-size:19px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{color:var(--mute);font-size:15px;flex:none}.time.u{color:var(--go);font-weight:700}
.last{color:var(--mute);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.badge{background:var(--go);color:#04210f;border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:14px;font-weight:700;padding:0 6px;flex:none}
.empty{color:var(--mute);padding:24px 4px;line-height:1.5}
nav{display:flex;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:var(--bg)}
nav button{flex:1;background:none;border:0;color:var(--mute);font-size:14px;padding:6px;position:relative}
nav button.on{color:var(--go);font-weight:600}
nav button i{display:block;font-style:normal;font-size:22px;margin-bottom:2px;position:relative;width:fit-content;margin-left:auto;margin-right:auto}
nav .nb{position:absolute;top:-6px;right:-14px;background:var(--go);color:#04210f;border-radius:99px;min-width:18px;height:18px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-style:normal}
nav .dot{position:absolute;top:0;right:-6px;width:8px;height:8px;background:var(--go);border-radius:50%}
.head{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line)}
.head button{background:none;border:0;color:var(--text);font-size:26px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:10px 14px;border-radius:16px;background:var(--card);align-self:flex-start;font-size:17px;white-space:pre-wrap;word-break:break-word}
.m.me{background:var(--me);align-self:flex-end}
.compose{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;padding:13px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:17px}
.compose button{border:0;border-radius:99px;background:var(--go);color:#04210f;font-weight:700;padding:0 20px;font-size:16px}
.card{margin:0 16px 16px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.card h2{margin:0 0 4px;font-size:20px}
.state{font-size:15px;margin:0 0 12px;color:var(--mute)}.state.ok{color:var(--go)}.state.bad{color:var(--bad)}
.card input{width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;font-weight:600}
.btn.go{background:var(--go);color:#04210f;border-color:var(--go)}
.hint{color:var(--mute);font-size:14px;line-height:1.45;margin:10px 0 0}
.set{margin:0 16px;padding:16px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.set button{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:10px}
#toast{position:fixed;left:16px;right:16px;bottom:90px;background:#26382f;color:var(--text);padding:12px 16px;border-radius:12px;display:none;z-index:9;font-size:15px}
</style>
</head>
<body>
<div id="app">
  <div class="view on" id="v-chat">
    <div class="logo"><b>GO</b><span>chat</span></div>
    <h1>Chat</h1><p class="sub" id="sub"></p>
    <input class="search" id="q" placeholder="Cari chat" autocomplete="off">
    <div class="scroll" id="list"></div>
  </div>
  <div class="view" id="v-conv">
    <div class="head"><button id="back" aria-label="Kembali">←</button><div class="av" id="cav" style="width:42px;height:42px;font-size:16px"></div><div class="name" id="cname"></div></div>
    <div class="msgs" id="msgs"></div>
    <div class="compose"><input id="inp" placeholder="Tulis pesan" autocomplete="off"><button id="send">Kirim</button></div>
  </div>
  <div class="view" id="v-status"><h1>Status</h1><p class="sub">Belum ada status baru.</p></div>
  <div class="view" id="v-set"><div class="scroll" style="padding:0">
    <h1>Pengaturan</h1><p class="sub">Atur aplikasi dan server.</p>
    <div class="card">
      <h2>Server</h2>
      <p class="state" id="sstate"></p>
      <div id="sform">
        <input id="surl" placeholder="Alamat server (https://...)" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="url">
        <input id="suser" placeholder="Nama pengguna" autocapitalize="none" autocorrect="off" spellcheck="false">
        <input id="spin" type="password" placeholder="PIN (minimal 4)">
        <div class="btns"><button class="btn go" id="blogin">Masuk</button><button class="btn" id="breg">Daftar</button></div>
        <p class="hint">Alamat server harus diawali https. Server gratis yang tidur bisa butuh sampai 1 menit untuk menjawab.</p>
      </div>
      <div id="sinfo" style="display:none"><div class="btns"><button class="btn" id="bout">Putuskan</button></div></div>
    </div>
    <div class="set"><span>Hapus chat contoh</span><button id="reset">Hapus</button></div>
  </div></div>
  <nav id="nav">
    <button data-v="chat" class="on"><i>💬<em class="nb" id="nb" style="display:none"></em></i>Chat</button>
    <button data-v="status"><i>◎<em class="dot"></em></i>Status</button>
    <button data-v="set"><i>⚙</i>Pengaturan</button>
  </nav>
</div>
<div id="toast"></div>
<script>
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));window.caches&&caches.keys().then(k=>k.forEach(x=>caches.delete(x)))}catch(e){}
const $=id=>document.getElementById(id);
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SEED=[
 {id:1,n:"Rani Putri",c:"#8a3556",t:"Kemarin",u:2,m:[["in","Kursinya di tengah, biar enak lihat layarnya"]]},
 {id:2,n:"Keluarga Besar",c:"#8a5a35",t:"Kemarin",u:2,m:[["in","Ayah: Ayah yang urus tikar dan kursi"]]},
 {id:3,n:"Dita - Kantor",c:"#6a3a8a",t:"Kemarin",m:[["in","Mantap. Kabari kalau ada yang kurang"]]},
 {id:4,n:"Bima Pratama",c:"#35608a",t:"Kemarin",m:[["in","Sip, makasih!"]]},
 {id:5,n:"Pak Arif - Bengkel",c:"#8a5a35",t:"6 Nov",m:[["out","Siap Pak, saya ambil jam 5"]]}
];
const REPLIES=["Oke, siap!","Sip, makasih!","Nanti kabari ya","Baik, noted","Mantap 👍"];
const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
let cfg=ld("gc_cfg",null),demo=ld("gc_demo",null)||JSON.parse(JSON.stringify(SEED));
const newSrv=()=>({msgs:[],last:0,read:{}});
let srv=cfg?ld("gc_srv_"+cfg.user,newSrv()):null;
let users=[],usersAt=0,online=false,cur=null,busy=false;

const ini=n=>n.split(/[ -]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const colorOf=n=>"hsl("+([...n].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7))+" 35% 33%)";
function fmt(ts){const d=new Date(ts),n=new Date(),p=x=>String(x).padStart(2,"0");
  if(d.toDateString()===n.toDateString())return p(d.getHours())+"."+p(d.getMinutes());
  const y=new Date(n);y.setDate(n.getDate()-1);if(d.toDateString()===y.toDateString())return "Kemarin";
  return d.getDate()+" "+MON[d.getMonth()];}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}

async function raw(url,o={}){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),70000);
  try{
    const r=await fetch(url,{method:o.method||"GET",signal:ac.signal,
      headers:Object.assign({"Content-Type":"application/json"},o.token?{Authorization:"Bearer "+o.token}:{}),
      body:o.body?JSON.stringify(o.body):undefined});
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok){const e=new Error(j.error||"Server menolak permintaan ("+r.status+")");e.status=r.status;throw e}
    return j;
  }catch(e){if(e.status)throw e;throw new Error("Tidak bisa terhubung ke server. Cek alamat dan koneksi internet.")}
  finally{clearTimeout(t)}
}
const api=(p,b)=>raw(cfg.url+p,{method:b?"POST":"GET",body:b,token:cfg.token});

function peerOf(m){return m.from===cfg.user?m.to:m.from}
function list(){
  if(!cfg)return demo.map(c=>{const l=c.m[c.m.length-1];return{key:String(c.id),name:c.n,color:c.c,time:c.t,last:(l[0]==="out"?"Kamu: ":"")+l[1],unread:c.u||0}});
  const g={};srv.msgs.forEach(m=>{(g[peerOf(m)]=g[peerOf(m)]||[]).push(m)});
  return Object.entries(g).map(([p,a])=>{const l=a[a.length-1],rd=srv.read[p]||0;
    return{key:p,name:p,color:colorOf(p),time:fmt(l.ts),last:(l.from===cfg.user?"Kamu: ":"")+l.text,
      unread:a.filter(m=>m.from!==cfg.user&&m.id>rd).length,ts:l.ts}}).sort((a,b)=>b.ts-a.ts);
}
function msgsOf(key){
  if(!cfg){const c=demo.find(c=>String(c.id)===key);return c?c.m:[]}
  return srv.msgs.filter(m=>peerOf(m)===key).map(m=>[m.from===cfg.user?"out":"in",m.text]);
}
function setSub(){
  $("sub").textContent=!cfg?"Kontak dan balasan di sini adalah contoh.":online?"Terhubung sebagai "+cfg.user:"Terputus. Mencoba menyambung lagi…";
}
function render(){
  setSub();
  const q=$("q").value.trim().toLowerCase();
  let rows=list(),total=rows.reduce((a,r)=>a+r.unread,0);
  const have=new Set(rows.map(r=>r.key));
  rows=rows.filter(r=>r.name.toLowerCase().includes(q));
  if(cfg&&q)users.filter(u=>u.includes(q)&&!have.has(u)).forEach(u=>rows.push({key:u,name:u,color:colorOf(u),time:"",last:"Mulai chat baru",unread:0}));
  $("list").innerHTML=rows.length?rows.map(r=>`<div class="row" data-key="${esc(r.key)}"><div class="av" style="background:${r.color}">${esc(ini(r.name))}</div>
    <div class="mid"><div class="top"><span class="name">${esc(r.name)}</span><span class="time ${r.unread?"u":""}">${esc(r.time)}</span></div>
    <div class="top"><span class="last">${esc(r.last)}</span>${r.unread?`<span class="badge">${r.unread}</span>`:""}</div></div></div>`).join("")
    :`<div class="empty">${cfg?"Belum ada chat. Ketik nama pengguna di kolom cari untuk mulai.":"Tidak ada chat."}</div>`;
  const nb=$("nb");nb.style.display=total?"grid":"none";nb.textContent=total;
}
function show(v){document.querySelectorAll(".view").forEach(e=>e.classList.remove("on"));$("v-"+v).classList.add("on");
  $("nav").style.display=v==="conv"?"none":"flex";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));}
function markRead(key){
  if(!cfg){const c=demo.find(c=>String(c.id)===key);if(c){c.u=0;sv("gc_demo",demo)}return}
  const ids=srv.msgs.filter(m=>peerOf(m)===key).map(m=>m.id);if(ids.length){srv.read[key]=Math.max(...ids);sv("gc_srv_"+cfg.user,srv)}
}
function openConv(key){
  cur=key;markRead(key);const name=cfg?key:(demo.find(c=>String(c.id)===key)||{}).n||key;
  $("cname").textContent=name;$("cav").textContent=ini(name);$("cav").style.background=cfg?colorOf(key):(demo.find(c=>String(c.id)===key)||{}).c;
  drawMsgs();show("conv");history.pushState({c:1},"");
}
function drawMsgs(){
  const box=$("msgs");box.innerHTML="";
  msgsOf(cur).forEach(([d,t])=>{const el=document.createElement("div");el.className="m"+(d==="out"?" me":"");el.textContent=t;box.appendChild(el)});
  box.scrollTop=1e9;
}
function closeConv(){cur=null;render();show("chat")}
window.addEventListener("popstate",()=>{if(cur!==null)closeConv()});
$("back").onclick=()=>history.back();
$("list").onclick=e=>{const r=e.target.closest(".row");if(r)openConv(r.dataset.key)};
$("q").oninput=()=>{render();if(cfg&&Date.now()-usersAt>10000)loadUsers()};

function addServer(arr){
  let ch=false;
  arr.forEach(m=>{if(m.id>srv.last){srv.msgs.push(m);srv.last=m.id;ch=true}});
  if(!ch)return;
  if(cur!==null)markRead(cur);
  sv("gc_srv_"+cfg.user,srv);if(cur!==null)drawMsgs();render();
}
async function send(){
  const v=$("inp").value.trim();if(!v||cur===null||busy)return;
  if(!cfg){const c=demo.find(c=>String(c.id)===cur);c.m.push(["out",v]);c.t="Baru saja";$("inp").value="";sv("gc_demo",demo);drawMsgs();
    const key=cur;setTimeout(()=>{c.m.push(["in",REPLIES[Math.floor(Math.random()*REPLIES.length)]]);sv("gc_demo",demo);if(cur===key)drawMsgs()},1000);return}
  busy=true;
  try{const r=await api("/send",{to:cur,text:v});$("inp").value="";addServer([r.msg])}
  catch(e){toast(e.message);if(e.status===401)disconnect()}
  busy=false;
}
$("send").onclick=send;$("inp").onkeydown=e=>{if(e.key==="Enter")send()};

async function poll(){
  if(!cfg||document.hidden)return;
  try{const r=await api("/sync?since="+srv.last);online=true;if(r.msgs.length)addServer(r.msgs)}
  catch(e){online=false;if(e.status===401){toast(e.message);disconnect();return}}
  setSub();updState();
}
async function loadUsers(){if(!cfg)return;try{users=(await api("/users")).users;usersAt=Date.now();if($("q").value)render()}catch(e){}}
setInterval(poll,2500);

function setState(t,cls){const e=$("sstate");e.textContent=t;e.className="state "+(cls||"")}
function updState(){
  $("sform").style.display=cfg?"none":"block";$("sinfo").style.display=cfg?"block":"none";
  if(!cfg)return;
  setState(online?"Terhubung ke "+cfg.url+" sebagai "+cfg.user:"Terputus dari "+cfg.url+". Mencoba menyambung lagi…",online?"ok":"bad");
}
function renderSet(){
  if(!cfg)setState("Belum terhubung. Aplikasi memakai chat contoh.","");
  updState();
}
function norm(u){u=u.trim().replace(/\/+$/,"");if(!u)return "";if(!/^https?:\/\//i.test(u))u="https://"+u;return u}
async function auth(mode){
  const url=norm($("surl").value),user=$("suser").value.trim().toLowerCase(),pin=$("spin").value;
  if(!url||!user||!pin){setState("Isi alamat server, nama pengguna, dan PIN.","bad");return}
  if(url.startsWith("http://")){setState("Alamat harus diawali https:// agar bisa dipakai di aplikasi.","bad");return}
  setState("Menghubungkan… server gratis bisa butuh sampai 1 menit.","");
  $("blogin").disabled=$("breg").disabled=true;
  try{
    const r=await raw(url+"/"+mode,{method:"POST",body:{username:user,pin}});
    cfg={url,user:r.user||user,token:r.token};sv("gc_cfg",cfg);
    srv=ld("gc_srv_"+cfg.user,newSrv());online=true;$("spin").value="";
    renderSet();render();poll();loadUsers();toast(mode==="register"?"Akun dibuat. Anda sudah masuk.":"Berhasil masuk.");
  }catch(e){setState(e.message,"bad")}
  $("blogin").disabled=$("breg").disabled=false;
}
$("blogin").onclick=()=>auth("login");$("breg").onclick=()=>auth("register");
function disconnect(){cfg=null;srv=null;online=false;users=[];sv("gc_cfg",null);cur=null;renderSet();render();show("set")}
$("bout").onclick=()=>{if(confirm("Putuskan dari server? Chat server tersimpan lagi saat Anda masuk kembali.")){disconnect()}};
$("reset").onclick=()=>{if(confirm("Kembalikan chat contoh ke awal?")){demo=JSON.parse(JSON.stringify(SEED));sv("gc_demo",demo);render()}};
$("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;cur=null;render();show(b.dataset.v);if(b.dataset.v==="set")renderSet()};
if(cfg)$("surl").value=cfg.url;
render();renderSet();if(cfg){poll();loadUsers()}
</script>
</body>
</html>
